services:
  api:
    build:
      context: .
      dockerfile: src/ExpenseSplitter.Api/Dockerfile
    ports:
      - "5299:5299"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/data/expensesplitter.db
    volumes:
      - api-data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  api-data:
